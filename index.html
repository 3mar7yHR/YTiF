<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Watch & Get Code</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 50px;
    }
    #player {
      margin: 20px auto;
    }
    #getCode {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      background: gray;
      color: white;
      transition: background 0.3s;
      cursor: pointer;
    }
    #getCode.active {
      background: green;
    }
    #message {
      color: red;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>

  <!-- إعلان مقطعي (PropellerAds/Monetag) -->
  <script>(function(s){s.dataset.zone='9959827',s.src='https://groleegni.net/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</head>
<body>

  <h2>Watch the video to unlock your code</h2>

  <!-- YouTube video -->
  <div id="player"></div>

  <!-- Button -->
  <button id="getCode">Get Code</button>

  <p id="message"></p>

  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let watchTime = 0;
    let watchInterval;
    const requiredTime = 6; // seconds
    const button = document.getElementById("getCode");
    const message = document.getElementById("message");

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '360',
        width: '640',
        videoId: '05gBJjyt124', // ضع ID الفيديو
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!watchInterval) {
          watchInterval = setInterval(() => {
            watchTime++;
            if (watchTime >= requiredTime) {
              clearInterval(watchInterval);
              button.classList.add("active");
            }
          }, 1000);
        }
      } else {
        clearInterval(watchInterval);
        watchInterval = null;
      }
    }

    button.addEventListener("click", () => {
      if (watchTime < requiredTime) {
        message.textContent = "⚠️ You must watch at least 1 minute before getting the code.";
      } else {
        message.textContent = "";

        // استدعاء الإعلان المقطعي (إن توفر)
        if (typeof invokeInterstitial === "function") {
          invokeInterstitial();
        }

        // إعادة التوجيه بعد 3 ثوانٍ
        setTimeout(() => {
          window.location.href = "code.html";
        }, 3000);
      }
    });
  </script>
</body>
</html>
