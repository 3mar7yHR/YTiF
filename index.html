<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Watch & Get Code</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 50px;
    }
    #player {
      margin: 20px auto;
    }
    #getCode {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      background: gray;
      color: white;
      transition: background 0.3s;
    }
    #getCode.active {
      background: green;
    }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      width: 300px;
    }
    .modal-content h3 {
      margin-bottom: 15px;
    }
    .copy-btn {
      margin-top: 10px;
      padding: 8px 15px;
      background: #4caf50;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Watch the video to unlock your code</h2>

  <!-- YouTube video -->
  <div id="player"></div>

  <!-- Button -->
  <button id="getCode">Get Code</button>

  <p id="message" style="color:red; font-weight:bold;"></p>

  <!-- Modal -->
  <div class="modal" id="codeModal">
    <div class="modal-content">
      <h3>Your Code</h3>
      <p id="codeText">ABCD-1234</p>
      <button class="copy-btn" onclick="copyCode()">Copy</button>
    </div>
  </div>

  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let watchTime = 0;
    let watchInterval;
    const requiredTime = 60; // seconds
    const button = document.getElementById("getCode");
    const message = document.getElementById("message");
    const modal = document.getElementById("codeModal");

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '360',
        width: '640',
        videoId: '05gBJjyt124', // غير الـ ID هنا
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!watchInterval) {
          watchInterval = setInterval(() => {
            watchTime++;
            if (watchTime >= requiredTime) {
              clearInterval(watchInterval);
              button.classList.add("active");
            }
          }, 1000);
        }
      } else {
        clearInterval(watchInterval);
        watchInterval = null;
      }
    }

    button.addEventListener("click", () => {
      if (watchTime < requiredTime) {
        message.textContent = "⚠️ You must watch at least 1 minute before getting the code.";
      } else {
        message.textContent = "";
        modal.style.display = "flex";
      }
    });

    function copyCode() {
      const code = document.getElementById("codeText").textContent;
      navigator.clipboard.writeText(code).then(() => {
        alert("✅ Code copied to clipboard!");
      });
    }

    // Close modal on click outside
    window.onclick = function(event) {
      if (event.target === modal) {
        modal.style.display = "none";
      }
    }
  </script>
</body>
</html>
